services:
  postgres:
    image: postgres:16
    container_name: flyrank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flyrank_tasks

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyrank_tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: flyrank-task-api
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: